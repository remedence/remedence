openapi: 3.1.0
info:
  title: Remedence API
  version: 0.1.0
  description: >-
    Canonical local-first API for Remedence findings, remediation, independent
    verification, immutable evidence metadata, reporting, and audit history.
    Remedence local v1 binds to loopback and does not provide authentication,
    webhook delivery, hosted verification workers, managed integrations, or AI inference.
servers:
  - url: /api/v1
    description: Relative Remedence API v1 namespace
tags:
  - name: Dashboard
  - name: Companies
  - name: Assets
  - name: Findings
  - name: Imports
  - name: Remediations
  - name: Verifications
  - name: Evidence
  - name: Reports
  - name: Audit
  - name: Webhooks
  - name: Integrations
paths:
  /dashboard:
    get:
      tags: [Dashboard]
      operationId: getDashboard
      summary: Get the persisted remediation workspace read model
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/CompanyQuery"
        - $ref: "#/components/parameters/StateQuery"
        - $ref: "#/components/parameters/SeverityQuery"
        - $ref: "#/components/parameters/OwnerQuery"
        - $ref: "#/components/parameters/SortQuery"
        - $ref: "#/components/parameters/IncludeVerified"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Current dashboard metrics, queue, activity, notifications, and report state.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSnapshot"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /companies:
    get:
      tags: [Companies]
      operationId: listCompanies
      summary: List managed companies
      responses:
        "200":
          description: Managed companies in the local organization.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Company"
        "500":
          $ref: "#/components/responses/InternalError"
  /companies/{companyId}:
    parameters:
      - $ref: "#/components/parameters/CompanyId"
    get:
      tags: [Companies]
      operationId: getCompany
      summary: Get one managed company
      responses:
        "200":
          description: Managed company.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /assets:
    get:
      tags: [Assets]
      operationId: listAssets
      summary: List persisted asset names referenced by findings
      parameters:
        - $ref: "#/components/parameters/CompanyQuery"
      responses:
        "200":
          description: Assets referenced by findings in the local organization.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssetSummary"
        "500":
          $ref: "#/components/responses/InternalError"
  /findings:
    get:
      tags: [Findings]
      operationId: listFindings
      summary: List normalized persisted findings
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/CompanyQuery"
        - $ref: "#/components/parameters/StateQuery"
        - $ref: "#/components/parameters/SeverityQuery"
        - $ref: "#/components/parameters/OwnerQuery"
        - $ref: "#/components/parameters/SortQuery"
        - $ref: "#/components/parameters/IncludeVerified"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paginated finding queue.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindingPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /findings/{findingId}:
    parameters:
      - $ref: "#/components/parameters/FindingId"
    get:
      tags: [Findings]
      operationId: getFinding
      summary: Get a finding with remediation, verification, evidence, and audit history
      responses:
        "200":
          description: Complete persisted finding detail.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindingDetail"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /imports:
    post:
      tags: [Imports]
      operationId: createImport
      summary: Import one normalized finding into the local workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateImportRequest"
      responses:
        "201":
          description: Finding imported and audit history appended.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
  /remediations:
    post:
      tags: [Remediations]
      operationId: createRemediation
      summary: Start a remediation record for an eligible finding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRemediationRequest"
      responses:
        "201":
          description: Remediation started.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Remediation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
  /remediations/{remediationId}/complete:
    parameters:
      - $ref: "#/components/parameters/RemediationId"
    post:
      tags: [Remediations]
      operationId: completeRemediation
      summary: Complete remediation and move the finding to awaiting verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteRemediationRequest"
      responses:
        "200":
          description: Completed remediation.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Remediation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
  /verifications:
    post:
      tags: [Verifications]
      operationId: createVerification
      summary: Start an operator-recorded independent verification run
      description: >-
        Local v1 records an independent verification result supplied by the operator.
        It does not execute commands or fetch arbitrary URLs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVerificationRequest"
      responses:
        "201":
          description: Verification run created in Running state.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationWithChecks"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
  /verifications/{verificationId}/checks:
    parameters:
      - $ref: "#/components/parameters/VerificationId"
    post:
      tags: [Verifications]
      operationId: createVerificationCheck
      summary: Record one check result for a running verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVerificationCheckRequest"
      responses:
        "201":
          description: Verification check recorded.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationCheck"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
  /verifications/{verificationId}/complete:
    parameters:
      - $ref: "#/components/parameters/VerificationId"
    post:
      tags: [Verifications]
      operationId: completeVerification
      summary: Complete a verification as Failed or atomically Verified fixed
      description: >-
        A Passed completion records and locks evidence, completes the verification,
        transitions the finding to Verified fixed, and appends audit events in one transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteVerificationRequest"
      responses:
        "200":
          description: Verification completion and resulting finding state.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationCompletion"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
  /evidence:
    get:
      tags: [Evidence]
      operationId: listEvidence
      summary: List immutable evidence metadata
      parameters:
        - name: finding_id
          in: query
          schema:
            type: string
        - name: verification_id
          in: query
          schema:
            type: string
        - name: locked
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Evidence metadata matching the filters.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EvidenceItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /evidence/{evidenceId}:
    parameters:
      - $ref: "#/components/parameters/EvidenceId"
    get:
      tags: [Evidence]
      operationId: getEvidence
      summary: Get immutable evidence metadata
      responses:
        "200":
          description: Evidence metadata.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceItem"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /reports:
    post:
      tags: [Reports]
      operationId: createReport
      summary: Create an immutable client report snapshot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReportRequest"
      responses:
        "201":
          description: Report snapshot created.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
  /reports/{reportId}:
    parameters:
      - $ref: "#/components/parameters/ReportId"
    get:
      tags: [Reports]
      operationId: getReport
      summary: Get an immutable report snapshot
      responses:
        "200":
          description: Report metadata and snapshot.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /reports/{reportId}/download:
    parameters:
      - $ref: "#/components/parameters/ReportId"
    get:
      tags: [Reports]
      operationId: downloadReport
      summary: Download a report snapshot as Markdown
      responses:
        "200":
          description: Markdown rendering of the immutable report snapshot.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Content-Disposition:
              schema:
                type: string
          content:
            text/markdown:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /audit-events:
    get:
      tags: [Audit]
      operationId: listAuditEvents
      summary: List append-only audit events in sequence order
      parameters:
        - name: entity_type
          in: query
          schema:
            type: string
        - name: entity_id
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Ordered audit events.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /webhooks:
    get:
      tags: [Webhooks]
      operationId: listWebhooks
      summary: List local webhook registrations
      description: >-
        Local v1 does not deliver outbound webhooks and exposes no webhook mutation endpoint.
      responses:
        "200":
          description: Local registrations. The v1 implementation returns an empty list.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WebhookRegistration"
        "500":
          $ref: "#/components/responses/InternalError"
  /integrations:
    get:
      tags: [Integrations]
      operationId: listIntegrations
      summary: List local integration capability states
      description: Local v1 records no credentials and provides no managed connector execution.
      responses:
        "200":
          description: Integration capability states.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IntegrationState"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  headers:
    RequestId:
      description: Correlation identifier for this request.
      schema:
        type: string
        minLength: 1
        maxLength: 80
  parameters:
    CompanyId:
      name: companyId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 100
    FindingId:
      name: findingId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 100
    RemediationId:
      name: remediationId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 100
    VerificationId:
      name: verificationId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 100
    EvidenceId:
      name: evidenceId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 100
    ReportId:
      name: reportId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 100
    Search:
      name: search
      in: query
      schema:
        type: string
        maxLength: 200
    CompanyQuery:
      name: company_id
      in: query
      schema:
        type: string
        maxLength: 100
    StateQuery:
      name: state
      in: query
      schema:
        $ref: "#/components/schemas/FindingState"
    SeverityQuery:
      name: severity
      in: query
      schema:
        $ref: "#/components/schemas/Severity"
    OwnerQuery:
      name: owner
      in: query
      schema:
        type: string
        maxLength: 120
    SortQuery:
      name: sort
      in: query
      schema:
        type: string
        enum: [priority, newest, sla]
        default: priority
    IncludeVerified:
      name: include_verified
      in: query
      schema:
        type: boolean
        default: false
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
  responses:
    BadRequest:
      description: Request validation failed.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: The requested resource does not exist.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: The requested mutation conflicts with persisted workflow state.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    RequestTooLarge:
      description: JSON request body exceeds 256 KiB.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InternalError:
      description: Unexpected server error without stack traces or local paths.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Severity:
      type: string
      enum: [Critical, High, Medium, Low, Info]
    FindingState:
      type: string
      enum:
        - Needs remediation
        - Remediating
        - Awaiting verification
        - Verification failed
        - Verified fixed
    RemediationStatus:
      type: string
      enum: [In progress, Completed, Cancelled]
    VerificationStatus:
      type: string
      enum: [Queued, Running, Passed, Failed, Cancelled]
    VerificationCheckStatus:
      type: string
      enum: [Pending, Passed, Failed, Skipped]
    RiskLevel:
      type: string
      enum: [Low, Medium, High, Critical]
    Company:
      type: object
      additionalProperties: false
      required:
        - id
        - organization_id
        - name
        - risk_score
        - risk_level
        - created_at
        - updated_at
      properties:
        id:
          type: string
        organization_id:
          type: string
        name:
          type: string
        risk_score:
          type: integer
          minimum: 0
          maximum: 100
        risk_level:
          $ref: "#/components/schemas/RiskLevel"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AssetSummary:
      type: object
      additionalProperties: false
      required: [company_id, name]
      properties:
        company_id:
          type: string
        name:
          type: string
    Finding:
      type: object
      additionalProperties: false
      required:
        - id
        - organization_id
        - company_id
        - finding_key
        - title
        - description
        - source
        - severity
        - state
        - owner
        - asset_name
        - detected_at
        - sla_due_at
        - created_at
        - updated_at
      properties:
        id:
          type: string
        organization_id:
          type: string
        company_id:
          type: string
        finding_key:
          type: string
          examples: [SEC-1042]
        title:
          type: string
        description:
          type: string
        source:
          type: string
        severity:
          $ref: "#/components/schemas/Severity"
        state:
          $ref: "#/components/schemas/FindingState"
        owner:
          type: string
        asset_name:
          type: string
        detected_at:
          type: string
          format: date-time
        sla_due_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    DashboardFinding:
      type: object
      additionalProperties: false
      required:
        - id
        - organization_id
        - company_id
        - finding_key
        - title
        - description
        - source
        - severity
        - state
        - owner
        - asset_name
        - detected_at
        - sla_due_at
        - created_at
        - updated_at
        - company_name
        - sla_breached
        - priority_bucket
      properties:
        id:
          type: string
        organization_id:
          type: string
        company_id:
          type: string
        finding_key:
          type: string
          examples: [SEC-1042]
        title:
          type: string
        description:
          type: string
        source:
          type: string
        severity:
          $ref: "#/components/schemas/Severity"
        state:
          $ref: "#/components/schemas/FindingState"
        owner:
          type: string
        asset_name:
          type: string
        detected_at:
          type: string
          format: date-time
        sla_due_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        company_name:
          type: string
        sla_breached:
          type: boolean
        priority_bucket:
          type: integer
          minimum: 1
          maximum: 6
    FindingPage:
      type: object
      additionalProperties: false
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DashboardFinding"
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
    Remediation:
      type: object
      additionalProperties: false
      required:
        - id
        - finding_id
        - status
        - summary
        - reference
        - owner
        - started_at
        - completed_at
        - created_at
        - updated_at
      properties:
        id:
          type: string
        finding_id:
          type: string
        status:
          $ref: "#/components/schemas/RemediationStatus"
        summary:
          type: string
        reference:
          type: string
        owner:
          type: string
        started_at:
          type: string
          format: date-time
        completed_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    VerificationRun:
      type: object
      additionalProperties: false
      required:
        - id
        - finding_id
