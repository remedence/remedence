      type: object
      additionalProperties: false
      required: [summary, reference]
      properties:
        summary:
          type: string
          minLength: 1
          maxLength: 2000
        reference:
          type: string
          minLength: 1
          maxLength: 500
    CreateVerificationRequest:
      type: object
      additionalProperties: false
      required:
        [
          finding_id,
          remediation_id,
          method,
          scope,
          source_revision,
          patch_digest,
          checks,
        ]
      properties:
        finding_id:
          type: string
          minLength: 1
          maxLength: 100
        remediation_id:
          type: string
          minLength: 1
          maxLength: 100
        method:
          type: string
          minLength: 1
          maxLength: 200
        source_revision:
          type: string
          minLength: 1
          maxLength: 200
        patch_digest:
          type: string
          pattern: "^[0-9a-f]{64}$"
        scope:
          type: string
          minLength: 1
          maxLength: 1000
        checks:
          type: array
          minItems: 1
          maxItems: 25
          items:
            type: string
            minLength: 1
            maxLength: 300
        profile_id:
          type: string
          minLength: 3
          maxLength: 64
          pattern: "^[a-z0-9][a-z0-9-]+$"
    CreateVerificationCheckRequest:
      type: object
      additionalProperties: false
      required: [sequence, name, status, message]
      properties:
        sequence:
          type: integer
          minimum: 1
          maximum: 100
        name:
          type: string
          minLength: 1
          maxLength: 300
        status:
          type: string
          enum: [Passed, Failed, Skipped]
        message:
          type: string
          maxLength: 2000
    CreateEvidenceItem:
      type: object
      additionalProperties: false
      required: [artifact_id, kind, label, source_reference, metadata]
      properties:
        artifact_id:
          type: string
          minLength: 1
          maxLength: 100
        kind:
          type: string
          minLength: 1
          maxLength: 100
        label:
          type: string
          minLength: 1
          maxLength: 300
        source_reference:
          type: string
          minLength: 1
          maxLength: 1000
        metadata:
          type: object
          additionalProperties: true
    EvidenceArtifact:
      type: object
      additionalProperties: false
      required:
        - id
        - content_hash
        - size_bytes
        - original_filename
        - scan_status
        - scanner
        - created_at
        - retention_until
      properties:
        id:
          type: string
        content_hash:
          type: string
          pattern: "^[a-f0-9]{64}$"
        size_bytes:
          type: integer
          minimum: 1
        original_filename:
          type: string
        scan_status:
          type: string
          enum: [Clean]
        scanner:
          type: string
        created_at:
          type: string
          format: date-time
        retention_until:
          type: string
          format: date-time
    CompleteVerificationRequest:
      type: object
      additionalProperties: false
      required: [result, summary]
      properties:
        result:
          type: string
          enum: [Passed, Failed]
        summary:
          type: string
          minLength: 1
          maxLength: 2000
        evidence:
          type: array
          maxItems: 25
          items:
            $ref: "#/components/schemas/CreateEvidenceItem"
    CreateReportRequest:
      type: object
      additionalProperties: false
      required: [company_id, period_label]
      properties:
        company_id:
          type: string
          minLength: 1
          maxLength: 100
        period_label:
          type: string
          minLength: 1
          maxLength: 200
    WebhookRegistration:
      type: object
      additionalProperties: false
      required: [id, status]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [Disabled]
    IntegrationState:
      type: object
      additionalProperties: false
      required: [id, name, status]
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [Not configured]
    ProblemFieldError:
      type: object
      additionalProperties: false
      required: [path, message]
      properties:
        path:
          type: string
        message:
          type: string
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, detail, instance, code, request_id]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
        request_id:
          type: string
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ProblemFieldError"
