openapi: 3.1.0
info:
  title: Remedence API
  version: 0.1.0
  description: >-
    Canonical API for authenticated tenant-scoped findings, remediation,
    independent verification, protected evidence, reporting, and audit history.
servers:
  - url: /api/v1
    description: Relative Remedence API v1 namespace
tags:
  - name: Onboarding
  - name: Dashboard
  - name: Companies
  - name: Assets
  - name: Findings
  - name: Imports
  - name: Remediations
  - name: Verifications
  - name: Evidence
  - name: Reports
  - name: Audit
  - name: Webhooks
  - name: Integrations
paths:
  /onboarding:
    get:
      tags: [Onboarding]
      operationId: getOnboardingStatus
      summary: Read the first-run workspace state
      responses:
        "200":
          description: Current workspace initialization state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingStatus"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Onboarding]
      operationId: initializeWorkspace
      summary: Initialize an empty workspace or explicitly install demo data
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitializeWorkspaceRequest"
      responses:
        "201":
          description: Workspace initialized exactly once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /dashboard:
    get:
      tags: [Dashboard]
      operationId: getDashboard
      summary: Get the persisted remediation workspace read model
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/CompanyQuery"
        - $ref: "#/components/parameters/StateQuery"
        - $ref: "#/components/parameters/SeverityQuery"
        - $ref: "#/components/parameters/OwnerQuery"
        - $ref: "#/components/parameters/SortQuery"
        - $ref: "#/components/parameters/IncludeVerified"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Current dashboard metrics, queue, activity, notifications, and report state.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSnapshot"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /companies:
    get:
      tags: [Companies]
      operationId: listCompanies
      summary: List managed companies
      responses:
        "200":
          description: Managed companies in the local organization.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Company"
        "500":
          $ref: "#/components/responses/InternalError"
  /companies/{companyId}:
    parameters:
      - $ref: "#/components/parameters/CompanyId"
    get:
      tags: [Companies]
      operationId: getCompany
      summary: Get one managed company
      responses:
        "200":
          description: Managed company.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /assets:
    get:
      tags: [Assets]
      operationId: listAssets
      summary: List persisted asset names referenced by findings
      parameters:
        - $ref: "#/components/parameters/CompanyQuery"
      responses:
        "200":
          description: Assets referenced by findings in the local organization.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssetSummary"
        "500":
          $ref: "#/components/responses/InternalError"
  /findings:
    get:
      tags: [Findings]
      operationId: listFindings
      summary: List normalized persisted findings
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/CompanyQuery"
        - $ref: "#/components/parameters/StateQuery"
        - $ref: "#/components/parameters/SeverityQuery"
        - $ref: "#/components/parameters/OwnerQuery"
        - $ref: "#/components/parameters/SortQuery"
        - $ref: "#/components/parameters/IncludeVerified"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paginated finding queue.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindingPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /findings/{findingId}:
    parameters:
      - $ref: "#/components/parameters/FindingId"
    get:
      tags: [Findings]
      operationId: getFinding
      summary: Get a finding with remediation, verification, evidence, and audit history
      responses:
        "200":
          description: Complete persisted finding detail.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            ETag:
              $ref: "#/components/headers/EntityTag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindingDetail"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /imports:
    post:
      tags: [Imports]
      operationId: createImport
      summary: Import one normalized finding into the local workspace
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateImportRequest"
      responses:
        "201":
          description: Finding imported and audit history appended.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
  /remediations:
    post:
      tags: [Remediations]
      operationId: createRemediation
      summary: Start a remediation record for an eligible finding
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRemediationRequest"
      responses:
        "201":
          description: Remediation started.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Location:
              schema:
                type: string
            ETag:
              $ref: "#/components/headers/EntityTag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Remediation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
  /remediations/{remediationId}/complete:
    parameters:
      - $ref: "#/components/parameters/RemediationId"
      - $ref: "#/components/parameters/IfMatch"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      tags: [Remediations]
      operationId: completeRemediation
      summary: Complete remediation and move the finding to awaiting verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteRemediationRequest"
      responses:
        "200":
          description: Completed remediation.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            ETag:
              $ref: "#/components/headers/EntityTag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Remediation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
  /verifications:
    post:
      tags: [Verifications]
      operationId: createVerification
      summary: Start a principal-bound independent verification run
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      description: >-
        Hosted runs bind verifier identity to an administrator-approved execution
        profile and atomically enqueue an isolated job. Local development may omit
        profile_id and record a principal-bound manual run.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVerificationRequest"
      responses:
        "201":
          description: Verification run created in Running state.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Location:
              schema:
                type: string
            ETag:
              $ref: "#/components/headers/EntityTag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationWithChecks"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /verification-profiles:
    get:
      tags: [Verifications]
      operationId: listVerificationProfiles
      summary: List approved isolated execution profiles
      responses:
        "200":
          description: Safe profile metadata without image commands or secrets.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VerificationProfile"
        "500":
          $ref: "#/components/responses/InternalError"
  /verification-jobs/{jobId}:
    parameters:
      - $ref: "#/components/parameters/VerificationJobId"
    get:
      tags: [Verifications]
      operationId: getVerificationJob
      summary: Read queued execution, retry, cancellation, and receipt state
      responses:
        "200":
          description: Tenant-scoped verification job and signed receipts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationJob"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /verification-jobs/{jobId}/cancel:
    parameters:
      - $ref: "#/components/parameters/VerificationJobId"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      tags: [Verifications]
      operationId: cancelVerificationJob
      summary: Request cancellation of a queued or running isolated execution
      responses:
        "200":
          description: Cancellation persisted or requested at the worker lease boundary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationJob"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /verification-jobs/{jobId}/retry:
    parameters:
      - $ref: "#/components/parameters/VerificationJobId"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      tags: [Verifications]
      operationId: retryVerificationJob
      summary: Requeue a dead-letter isolated execution after operator review
      responses:
        "200":
          description: Dead-letter job returned to the durable queue with prior receipts retained.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationJob"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /verifications/{verificationId}/checks:
    parameters:
      - $ref: "#/components/parameters/VerificationId"
      - $ref: "#/components/parameters/IfMatch"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      tags: [Verifications]
      operationId: createVerificationCheck
      summary: Record one check result for a running verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVerificationCheckRequest"
      responses:
        "201":
          description: Verification check recorded.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            ETag:
              $ref: "#/components/headers/EntityTag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationCheck"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
  /verifications/{verificationId}/complete:
    parameters:
      - $ref: "#/components/parameters/VerificationId"
      - $ref: "#/components/parameters/IfMatch"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      tags: [Verifications]
      operationId: completeVerification
      summary: Complete a verification as Failed or atomically Verified fixed
      description: >-
        A Passed completion records and locks evidence, completes the verification,
        transitions the finding to Verified fixed, and appends audit events in one transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteVerificationRequest"
      responses:
        "200":
          description: Verification completion and resulting finding state.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            ETag:
              $ref: "#/components/headers/EntityTag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationCompletion"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
  /evidence:
    get:
      tags: [Evidence]
      operationId: listEvidence
      summary: List immutable evidence metadata
      parameters:
        - name: finding_id
          in: query
          schema:
            type: string
        - name: verification_id
          in: query
          schema:
            type: string
        - name: locked
          in: query
          schema:
            type: boolean
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Evidence metadata matching the filters.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidencePage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /evidence/artifacts:
    post:
      tags: [Evidence]
      operationId: uploadEvidenceArtifact
      summary: Upload and malware-scan an immutable evidence artifact
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: X-Evidence-Filename
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 255
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Artifact stored after a clean malware scan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceArtifact"
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /evidence/{evidenceId}:
    parameters:
      - $ref: "#/components/parameters/EvidenceId"
    get:
      tags: [Evidence]
      operationId: getEvidence
      summary: Get immutable evidence metadata
      responses:
        "200":
          description: Evidence metadata.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceItem"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /evidence/{evidenceId}/content:
    parameters:
      - $ref: "#/components/parameters/EvidenceId"
    get:
      tags: [Evidence]
      operationId: downloadEvidenceArtifact
      summary: Download an integrity-checked protected evidence artifact
      responses:
        "200":
          description: Protected evidence bytes.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /reports:
    post:
      tags: [Reports]
      operationId: createReport
      summary: Create an immutable client report snapshot
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReportRequest"
      responses:
        "201":
          description: Report snapshot created.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
  /reports/{reportId}:
    parameters:
      - $ref: "#/components/parameters/ReportId"
    get:
      tags: [Reports]
      operationId: getReport
      summary: Get an immutable report snapshot
      responses:
        "200":
          description: Report metadata and snapshot.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /reports/{reportId}/download:
    parameters:
      - $ref: "#/components/parameters/ReportId"
    get:
      tags: [Reports]
      operationId: downloadReport
      summary: Download a report snapshot as Markdown
      responses:
        "200":
          description: Markdown rendering of the immutable report snapshot.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Content-Disposition:
              schema:
                type: string
          content:
            text/markdown:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /audit-events:
    get:
      tags: [Audit]
      operationId: listAuditEvents
      summary: List append-only audit events in sequence order
      parameters:
        - name: entity_type
          in: query
          schema:
            type: string
        - name: entity_id
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Ordered audit events.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /webhooks:
    get:
      tags: [Webhooks]
      operationId: listWebhooks
      summary: List local webhook registrations
      description: >-
        Local v1 does not deliver outbound webhooks and exposes no webhook mutation endpoint.
      responses:
        "200":
          description: Local registrations. The v1 implementation returns an empty list.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WebhookRegistration"
        "500":
          $ref: "#/components/responses/InternalError"
  /integrations:
    get:
      tags: [Integrations]
      operationId: listIntegrations
      summary: List local integration capability states
      description: Local v1 records no credentials and provides no managed connector execution.
      responses:
        "200":
          description: Integration capability states.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IntegrationState"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  headers:
    RequestId:
      description: Correlation identifier for this request.
      schema:
        type: string
        minLength: 1
        maxLength: 80
    EntityTag:
      description: Strong entity version tag for optimistic concurrency.
      schema:
        type: string
    IdempotencyReplayed:
      description: True when a completed response was durably replayed.
      schema:
        type: string
        enum: ["true", "false"]
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: >-
        Optional tenant- and principal-scoped replay key. Reusing the key for
        the same request replays its successful response for 24 hours; changing
        the operation or payload returns 409.
      schema:
        type: string
        pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{7,199}$"
    IfMatch:
      name: If-Match
      in: header
      description: Required strong ETag returned for the target resource. Omission returns 428.
      schema:
        type: string
        minLength: 1
        maxLength: 512
    CompanyId:
      name: companyId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 100
    FindingId:
      name: findingId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 100
    RemediationId:
      name: remediationId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 100
    VerificationId:
      name: verificationId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 100
    VerificationJobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 100
    EvidenceId:
      name: evidenceId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 100
    ReportId:
      name: reportId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 100
    Search:
      name: search
      in: query
      schema:
        type: string
        maxLength: 200
    CompanyQuery:
      name: company_id
      in: query
      schema:
        type: string
        maxLength: 100
    StateQuery:
      name: state
      in: query
      schema:
        $ref: "#/components/schemas/FindingState"
    SeverityQuery:
      name: severity
      in: query
      schema:
        $ref: "#/components/schemas/Severity"
    OwnerQuery:
      name: owner
      in: query
      schema:
        type: string
        maxLength: 120
    SortQuery:
      name: sort
      in: query
      schema:
        type: string
        enum: [priority, newest, sla]
        default: priority
    IncludeVerified:
      name: include_verified
      in: query
      schema:
        type: boolean
        default: false
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        minLength: 1
        maxLength: 1024
        pattern: "^[A-Za-z0-9_-]+$"
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
  responses:
    BadRequest:
      description: Request validation failed.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: The authenticated principal is not authorized for this operation.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: The requested resource does not exist.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: The requested mutation conflicts with persisted workflow state.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PreconditionFailed:
      description: The supplied entity ETag is stale or targets another resource.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PreconditionRequired:
      description: The mutation requires If-Match with the current entity ETag.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    RequestTooLarge:
      description: JSON request body exceeds 256 KiB.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableEntity:
      description: Uploaded content was rejected by the evidence security boundary.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ServiceUnavailable:
      description: A required protected dependency or artifact is unavailable.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InternalError:
      description: Unexpected server error without stack traces or local paths.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
