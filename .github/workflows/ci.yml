name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.1-bookworm
        env:
          POSTGRES_DB: remedence_test
          POSTGRES_USER: remedence
          POSTGRES_PASSWORD: remedence-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U remedence -d remedence_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 24.x
          - 26.x

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun ci

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run repository checks
        env:
          REMEDENCE_DATA_DIR: ${{ runner.temp }}/remedence-data
          REMEDENCE_TEST_POSTGRES_URL: postgresql://remedence:remedence-ci-only@127.0.0.1:5432/remedence_test
        run: bun run check
